# Spectrum analyser (fft/): averaged power spectra (N = 4096, 2048, 1024 or
# 512 bins) of rx0, rx1 or one nbiq channel, computed in the PL. Registers of
# fft/rtl/fft_axi.sv. Configuration (CTRL source, channel and LEN, NAVG,
# SCALE, RSHIFT) is taken when an average starts; RES_CFG / RES_SCALE
# describe the result in RESULT. With CTRL.STREAM each result also goes out
# on the core's AXI4-Stream master to an axi_dmac as one packet ([[packet]]
# HDR0, HDR1, then the N result words).

[core]
name = "fft"
title = "Spectrum analyser"
uio = "fft"
size = 0x10000
id = { offset = 0x004, value = 0x46465453 }        # "FFTS"
version = { offset = 0x000, value = 0x00010100 }
rtl = "fft/rtl/fft_axi.sv"
maps = ["regs", "dmac", "ring"]

[[const]]
name = "N"
value = 4096
doc = "Largest FFT length (bins, RESULT words; CTRL.LEN = 0, the reset value)"

[[const]]
name = "LOG2N_MIN"
value = 9
doc = "log2 of the smallest FFT length (512, CTRL.LEN = 3)"

[[const]]
name = "PKT_HDR_BYTES"
value = 16
doc = "Stream packet header (HDR0, HDR1); RESULT word j follows at byte 16 + 4 j"

[[const]]
name = "PKT_BYTES_MAX"
value = 16400
doc = "Largest stream packet (N = 4096): 16 + 4 N bytes, 2 + N/2 64-bit beats"

[[const]]
name = "PKT_MAGIC"
value = 0xF5
doc = "HDR0.MAGIC value of a stream packet"

[[const]]
name = "WIN_SUM_4096"
value = 192555426
doc = "Sum of the reset window over 4096 samples (2^17 = 1.0): 1469.08 x 2^17"

[[const]]
name = "WIN_SUM_2048"
value = 96277713
doc = "Sum of the reset window over 2048 samples (every 2nd): 734.54 x 2^17"

[[const]]
name = "WIN_SUM_1024"
value = 48138849
doc = "Sum of the reset window over 1024 samples (every 4th): 367.27 x 2^17"

[[const]]
name = "WIN_SUM_512"
value = 24069419
doc = "Sum of the reset window over 512 samples (every 8th): 183.64 x 2^17"

[[const]]
name = "NAVG_MAX"
value = 256
doc = "Largest NAVG"

[[const]]
name = "RSHIFT_MAX"
value = 8
doc = "Largest RSHIFT"

[[const]]
name = "WIN_ONE"
value = 131072
doc = "WIN value for a gain of 1 (2^17)"

[[const]]
name = "SCALE_RX"
value = 0x555400
doc = "Scale schedule for the 12-bit ADC sources (rx0, rx1): total shift 7 at N = 4096 (12 - log2 N less for shorter N), no overflow at any N"

[[const]]
name = "SCALE_NBIQ"
value = 0x555550
doc = "Scale schedule for nbiq channels at their default gain 8 (12-bit full scale = 16384): total shift 10 at N = 4096, any N"

[[const]]
name = "SCALE_16"
value = 0x555555
doc = "Scale schedule for full-scale 16-bit data (nbiq): total shift 12 at N = 4096 (log2 N in general), no overflow"

[[reg]]
name = "VERSION"
offset = 0x000
access = "ro"
doc = "Core version, 0x0001_0100 = 1.1 (1.0: N = 4096 only, no stream)"
  [[reg.field]]
  name = "MINOR"
  bits = [0, 15]
  doc = "Minor version"
  [[reg.field]]
  name = "MAJOR"
  bits = [16, 31]
  doc = "Major version"

[[reg]]
name = "ID"
offset = 0x004
access = "ro"
doc = "Core identification \"FFTS\" (0x46465453)"

[[reg]]
name = "CTRL"
offset = 0x008
access = "rw"
reset = 0
doc = "Control; SRC, NB_CH and LEN are taken when an average starts"
  [[reg.field]]
  name = "RUN"
  bits = [0, 0]
  doc = "Start averages back to back (DOUBLE_BUF = 0 without STREAM: each after DONE is cleared); 0 stops after the current one"
  [[reg.field]]
  name = "IRQ_EN"
  bits = [1, 1]
  doc = "Interrupt on DONE"
  [[reg.field]]
  name = "STREAM"
  bits = [2, 2]
  doc = "Send each result on the AXI4-Stream master (one packet); RUN then no longer waits for DONE, and DONE no longer protects RESULT"
  [[reg.field]]
  name = "SRC"
  bits = [4, 5]
  doc = "Source"
  enum = { RX0 = 0, RX1 = 1, NBIQ = 2 }
  [[reg.field]]
  name = "NB_CH"
  bits = [8, 10]
  doc = "nbiq channel (tap_ch) when SRC = NBIQ, 0..4"
  [[reg.field]]
  name = "LEN"
  bits = [12, 13]
  doc = "Transform length N = 4096 >> LEN"
  enum = { N4096 = 0, N2048 = 1, N1024 = 2, N512 = 3 }

[[reg]]
name = "CMD"
offset = 0x00C
access = "wo"
doc = "Commands (write 1)"
  [[reg.field]]
  name = "START"
  bits = [0, 0]
  doc = "Clear DONE; start one average if the core is idle (BUSY = 0)"
  [[reg.field]]
  name = "ABORT"
  bits = [1, 1]
  doc = "Reset the FFT and the sequencer, drop the average in progress, clear DONE (RUN stays: a new average starts with the current configuration); a stream packet in progress is completed"
  [[reg.field]]
  name = "STR_ABORT"
  bits = [2, 2]
  doc = "Drop the result waiting for the stream, or end the packet in progress at once without TLAST (only with the DMA stopped)"

[[reg]]
name = "NAVG"
offset = 0x010
access = "rw"
reset = 1
doc = "Spectra per average"
  [[reg.field]]
  name = "NAVG"
  bits = [0, 8]
  doc = "1..256 (0 counts as 1, larger values as 256)"

[[reg]]
name = "SCALE"
offset = 0x014
access = "rw"
reset = 0x555400
doc = "FFT scale schedule"
  [[reg.field]]
  name = "SCALE"
  bits = [0, 23]
  doc = "2 bits per radix-2 stage (shift 0..3), stage 0 in bits [1:0]; stages 0..log2 N - 1 apply (the bits above are ignored); output = DFT / 2^(sum of the shifts)"

[[reg]]
name = "RSHIFT"
offset = 0x018
access = "rw"
reset = 0
doc = "Result scaling"
  [[reg.field]]
  name = "RSHIFT"
  bits = [0, 3]
  doc = "Right shift of the 40-bit power sum, 0..8 (larger values: 8); log2(NAVG) gives the mean"

[[reg]]
name = "STATUS"
offset = 0x01C
access = "ro"
doc = "Status"
  [[reg.field]]
  name = "BUSY"
  bits = [0, 0]
  doc = "An average is in progress"
  [[reg.field]]
  name = "DONE"
  bits = [1, 1]
  doc = "Copy of DONE"
  [[reg.field]]
  name = "CAPT"
  bits = [2, 2]
  doc = "Samples are being loaded into the FFT"
  [[reg.field]]
  name = "STR_WAIT"
  bits = [3, 3]
  doc = "A result waits for the stream (m_axis_tready low)"
  [[reg.field]]
  name = "STR_SEND"
  bits = [4, 4]
  doc = "A stream packet is being sent"
  [[reg.field]]
  name = "FRAME"
  bits = [8, 15]
  doc = "Frame of the average being captured (0..NAVG-1)"

[[reg]]
name = "DONE"
offset = 0x020
access = "w1c"
reset = 0
doc = "Result ready (interrupt source)"
  [[reg.field]]
  name = "DONE"
  bits = [0, 0]
  doc = "Set when a result is published in RESULT; write 1 to clear (acknowledge)"

[[reg]]
name = "FLAGS"
offset = 0x024
access = "w1c"
reset = 0
doc = "Sticky error flags, write 1 to clear"
  [[reg.field]]
  name = "FFT_OVF"
  bits = [0, 0]
  doc = "FFT overflow in some frame (SCALE too small for the input)"
  [[reg.field]]
  name = "SAT"
  bits = [1, 1]
  doc = "A result word saturated at 0xFFFFFFFF (RSHIFT too small)"
  [[reg.field]]
  name = "LOST"
  bits = [2, 2]
  doc = "A sample reached the FFT while it was not ready, or the frame order was wrong (should never happen)"
  [[reg.field]]
  name = "DROP"
  bits = [3, 3]
  doc = "DOUBLE_BUF: an average finished while DONE was set and was dropped"
  [[reg.field]]
  name = "SDROP"
  bits = [4, 4]
  doc = "STREAM: a result was not streamed (m_axis_tready low until the buffer was needed again)"

[[reg]]
name = "FRAMES"
offset = 0x028
access = "ro"
doc = "FFT frames accumulated since reset (wraps)"

[[reg]]
name = "AVGS"
offset = 0x02C
access = "ro"
doc = "Results published since reset (wraps); unchanged before and after reading RESULT means a consistent copy"

[[reg]]
name = "DROPS"
offset = 0x030
access = "ro"
doc = "Averages dropped since reset (DOUBLE_BUF, result still unread)"

[[reg]]
name = "RES_CFG"
offset = 0x034
access = "ro"
doc = "Configuration of the published result"
  [[reg.field]]
  name = "SRC"
  bits = [0, 1]
  doc = "Source"
  enum = { RX0 = 0, RX1 = 1, NBIQ = 2 }
  [[reg.field]]
  name = "NB_CH"
  bits = [4, 6]
  doc = "nbiq channel"
  [[reg.field]]
  name = "RSHIFT"
  bits = [8, 11]
  doc = "Result right shift"
  [[reg.field]]
  name = "LOG2N"
  bits = [12, 15]
  doc = "log2 of the transform length (9..12): the result has 2^LOG2N words"
  [[reg.field]]
  name = "NAVG"
  bits = [16, 24]
  doc = "Spectra averaged (1..256)"
  [[reg.field]]
  name = "FFT_OVF"
  bits = [28, 28]
  doc = "FFT overflow in a frame of this average"
  [[reg.field]]
  name = "SAT"
  bits = [29, 29]
  doc = "A word of this result saturated"

[[reg]]
name = "RES_SCALE"
offset = 0x038
access = "ro"
doc = "Scale schedule of the published result"
  [[reg.field]]
  name = "SCALE"
  bits = [0, 23]
  doc = "As SCALE"

[[reg]]
name = "INFO"
offset = 0x03C
access = "ro"
doc = "Build options"
  [[reg.field]]
  name = "LOG2N"
  bits = [0, 3]
  doc = "log2 of the largest FFT length (12)"
  [[reg.field]]
  name = "DOUBLE_BUF"
  bits = [4, 4]
  doc = "Separate result buffer: averages continue while the ARM reads"
  [[reg.field]]
  name = "STREAM"
  bits = [5, 5]
  doc = "The AXI4-Stream result output exists (CTRL.STREAM)"
  [[reg.field]]
  name = "LOG2N_MIN"
  bits = [8, 11]
  doc = "log2 of the smallest FFT length (9)"

[[reg]]
name = "STR_SENT"
offset = 0x040
access = "ro"
doc = "Stream packets sent since reset (wraps)"

[[reg]]
name = "STR_DROPS"
offset = 0x044
access = "ro"
doc = "Results not streamed since reset (wraps; SEQ gaps in the packets)"

[[window]]
name = "WIN"
offset = 0x2000
words = 2048
access = "wo"
width = 18
doc = "Window table: w[m] = w[4095 - m] = WIN[m], unsigned, 2^17 = 1.0 (at most 2^17); write while idle. Reset: 4-term Blackman-Harris. An N-point frame uses w[n 4096 / N]"

[[window]]
name = "RESULT"
offset = 0x4000
words = 4096
access = "ro"
width = 32
doc = "Result word j < N = min(sum over NAVG frames of |X[k]|^2 >> RSHIFT, 2^32 - 1), k = j ^ N/2: FFT-shifted, frequency (j - N/2) fs / N; valid while DONE (without STREAM)"

[[packet]]
name = "HDR0"
width = 64
doc = "Beat 0 of a stream packet (bytes 0..7, little endian)"
  [[packet.field]]
  name = "MAGIC"
  bits = [0, 7]
  doc = "0xF5 (PKT_MAGIC)"
  [[packet.field]]
  name = "LOG2N"
  bits = [8, 11]
  doc = "log2 N: 2^LOG2N result words follow the header"
  [[packet.field]]
  name = "SRC"
  bits = [12, 13]
  doc = "Source"
  enum = { RX0 = 0, RX1 = 1, NBIQ = 2 }
  [[packet.field]]
  name = "NB_CH"
  bits = [16, 18]
  doc = "nbiq channel"
  [[packet.field]]
  name = "RSHIFT"
  bits = [20, 23]
  doc = "Result right shift"
  [[packet.field]]
  name = "FFT_OVF"
  bits = [24, 24]
  doc = "FFT overflow in a frame of this average"
  [[packet.field]]
  name = "SAT"
  bits = [25, 25]
  doc = "A word of this result saturated"
  [[packet.field]]
  name = "SKIP"
  bits = [26, 26]
  doc = "Results were dropped since the previous packet (SEQ jumped)"
  [[packet.field]]
  name = "SEQ"
  bits = [32, 63]
  doc = "Sequence number: AVGS of this result"

[[packet]]
name = "HDR1"
width = 64
doc = "Beat 1 of a stream packet (bytes 8..15); RESULT words from byte 16, two per beat ({word 2m+1, word 2m}), TLAST on the last"
  [[packet.field]]
  name = "SCALE"
  bits = [0, 23]
  doc = "Scale schedule (as RES_SCALE)"
  [[packet.field]]
  name = "NAVG"
  bits = [32, 40]
  doc = "Spectra averaged (1..256)"
