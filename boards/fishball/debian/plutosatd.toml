# plutosatd on a fishball board (Debian); every key not set here has the
# default of /usr/share/doc/plutosatd/api.md (station/docs/api.md) section 5.
# The plutosatd package installs this as /etc/plutosat/plutosatd.toml (a
# conffile: your edits are kept on upgrades), and its postinst replaces
# ADMIN_PASSWORD by a random password it prints once; deploy.sh --station
# (without packages) does the same when the file does not exist yet.
# After editing: systemctl restart plutosatd

[http]
# HTTPS on every interface: browsers give WebCodecs and the camera only to a
# secure context. tls = "auto" makes a self-signed certificate next to this
# file (accept it once in the browser, or install it from /cert.crt);
# plain HTTP on port 80 redirects to it
listen = "0.0.0.0:443"
tls = "auto"
redirect_listen = "0.0.0.0:80"
web_root = "/usr/share/plutosat/web"

[auth]
admin_password = "ADMIN_PASSWORD"

[radio]
# QO-100 IF with a 9750 MHz LNB
rx_lo_hz = 744500000
lnb_lo_hz = 9750000000

[rx0]
sym_rate = 333000
modcod = "auto"
auto_start = false

[rx1]
sym_rate = 333000
modcod = "auto"
auto_start = false

[spectrum.display]
# Shared browser defaults. Users can override these in their own widget settings.
auto = false
min_db = -110
max_db = -40
wf_min_db = -103
wf_max_db = -48
# Channel mean above the noise floor; clear occupied below threshold - hysteresis.
occupancy_threshold_db = 3.0
occupancy_hysteresis_db = 2.0

# Transmitting is off on a new installation. To transmit, set enabled = true
# (in [tx] for DATV, in [nbtx] for narrowband: SSB, CW, FT8 / FT4, RADE),
# check the band limits and your licence, and restart plutosatd. Off, the
# daemon leaves the transmit cores alone and refuses to arm (api.md 7, 8.1).
[tx]
enabled = false
callsign = "N0CALL"

[nbtx]
enabled = false
