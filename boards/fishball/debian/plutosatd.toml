# plutosatd on a fishball board (Debian); every key not set here has the
# default of station/docs/api.md section 5. deploy.sh --station installs
# this as /etc/plutosat/plutosatd.toml only when that file does not exist
# yet, with ADMIN_PASSWORD replaced by a random password it prints.

[http]
# HTTPS on every interface: browsers give WebCodecs and the camera only to a
# secure context. tls = "auto" makes a self-signed certificate next to this
# file (accept it once in the browser, or install it from /cert.crt);
# plain HTTP on port 80 redirects to it
listen = "0.0.0.0:443"
tls = "auto"
redirect_listen = "0.0.0.0:80"
web_root = "/usr/share/plutosat/web"

[auth]
admin_password = "ADMIN_PASSWORD"

[radio]
# QO-100 IF with a 9750 MHz LNB
rx_lo_hz = 744500000
lnb_lo_hz = 9750000000

[rx0]
sym_rate = 333000
modcod = "auto"
auto_start = false

[rx1]
sym_rate = 333000
modcod = "auto"
auto_start = false

[tx]
callsign = "N0CALL"
